name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APP_BUNDLE_ID: com.installment.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and sync Capacitor iOS
        run: |
          npm run build
          npx cap sync ios

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App

      - name: Build unsigned application
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/DerivedData \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find ios/build/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [[ -z "$APP_PATH" ]]; then
            echo "No .app bundle was produced by xcodebuild."
            exit 1
          fi

          PACKAGE_DIR="$RUNNER_TEMP/unsigned-ipa"
          IPA_PATH="$GITHUB_WORKSPACE/ios/build/export/Fazatak-unsigned.ipa"

          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Payload" "$(dirname "$IPA_PATH")"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/"

          (
            cd "$PACKAGE_DIR"
            ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_PATH"
          )

          test -s "$IPA_PATH"
          echo "Created unsigned IPA: $IPA_PATH"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Fazatak-unsigned-iOS-${{ github.run_number }}
          path: ios/build/export/Fazatak-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
